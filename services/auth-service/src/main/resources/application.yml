server:
  port: ${PORT:8081}
  shutdown: graceful
  forward-headers-strategy: native

spring:
  application:
    name: auth-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/auth_db
    username: platform
    password: platform
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

    producer:
      acks: all
      properties:
        max.block.ms: 5000 # MỚI: Giới hạn thời gian producer chờ Kafka sẵn sàng
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    permit-all: false

  auth:
    issuer: ${AUTH_ISSUER:http://localhost:8081}
    access-token-ttl: 15m
    rsa-private-key: ${AUTH_RSA_PRIVATE_KEY:}

    # MỚI: Thời hạn sử dụng của Refresh Token
    refresh-token:
      ttl: 14d

    # MỚI: Giới hạn số lần đăng nhập trong một khoảng thời gian
    login-limit:
      max-per-email: 5
      max-per-ip: 20
      window: 15m

  # MỚI: Cấu hình Transactional Outbox
  outbox:
    enabled: true
    poll-interval-ms: 400
    batch-size: 50