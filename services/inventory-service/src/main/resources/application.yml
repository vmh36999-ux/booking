server:
  port: ${PORT:8086}
  shutdown: graceful

spring:
  application:
    name: inventory-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/inventory_db
    username: platform
    password: platform
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema do Flyway quản lý, Hibernate chỉ kiểm tra
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true      # /actuator/health/liveness và /readiness cho Kubernetes

app:
  security:
    permit-all: false
  
  inventory:
    hold-ttl: 15m            # giữ chỗ bao lâu thì hết hạn nếu chưa xác nhận
    horizon-days: 365        # tạo tồn kho cho bao nhiêu ngày tới khi có loại phòng mới
    max-nights: 30           # một lần giữ chỗ tối đa bao nhiêu đêm
    expiry:
      enabled: true          # false = tắt job quét hold hết hạn
      interval: PT1M         # job chạy sau mỗi 1 phút (chuẩn ISO-8601: PT1M, PT30S...)
      lock-at-least-for: PT20S   # giữ khóa ShedLock tối thiểu 20 giây: hai instance không chạy chồng nhau
      batch-size: 100        # mỗi lượt xử lý tối đa 100 hold